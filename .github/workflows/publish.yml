name: Publish to npm

# Publishes @apertis/mcp-server when a GitHub Release is published.
#
# Two jobs, so that nothing which runs dependency code can publish:
#   build    installs, tests, runs the clean-install smoke test and packs the
#            tarball. It has no id-token permission and no npm credential.
#   publish  receives only the tarball and publishes it without running any
#            package script.
#
# Authentication is npm trusted publishing (OIDC): the package's settings on
# npmjs.com name this repository and this workflow file, so no long-lived token
# is stored. The job stages the version (`npm stage publish`, which every trusted
# publisher may run); it becomes installable only after a maintainer approves it
# with 2FA in the package's Staged Packages tab on npmjs.com. A direct
# `npm publish` was refused with E403 "OIDC permission denied for this action",
# because trusted publishers created after 2026-09-03 are stage-only by default. No token is passed and no .npmrc is written, so npm can only
# authenticate through OIDC (a stale token in .npmrc took precedence, #8452).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: The tag is the version in package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Build + test
        run: npm test

      - name: Clean-install smoke test
        run: npm run smoke

      - name: Pack
        run: npm run build && mkdir "$RUNNER_TEMP/package" && npm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write   # OIDC: trusted publishing and the provenance attestation
    steps:
      # Node 24 ships npm 11.19, and trusted publishing needs npm 11.5.1 or later.
      # Nothing is installed in this job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package

      # The artifact must hold exactly the one tarball this release names.
      - name: Publish
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tarball="apertis-mcp-server-${TAG#v}.tgz"
          test "$(ls -A)" = "$tarball"
          npm stage publish "./$tarball" --provenance --access public --ignore-scripts
